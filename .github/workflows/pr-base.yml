name: PR Base

on:
  pull_request:

jobs:
  require-main-base:
    runs-on: ubicloud
    steps:
      - name: Rehearsal runner identity and starting counters
        run: |
          date -u +%FT%TZ
          hostname
          nproc
          lscpu
          head -1 /proc/stat
          cat /proc/uptime
          cat /proc/meminfo
          cat /proc/self/cgroup
          df -B1 /
          command -v rustup || true
          command -v cargo || true
      - name: Require main as PR base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "PR base must be main, got '$BASE_REF'." >&2
            exit 1
          fi
      - name: Rehearsal ending counters
        if: always()
        run: |
          date -u +%FT%TZ
          head -1 /proc/stat
          cat /proc/uptime
