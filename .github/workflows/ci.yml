name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: boat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: rustup component add rustfmt
      - run: cargo fmt --check

  dprint:
    runs-on: boat
    steps:
      - uses: actions/checkout@v7
      - uses: dprint/check@v2.5

  clippy:
    runs-on: boat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: rustup component add clippy
      - run: cargo clippy -- -D warnings

  test:
    runs-on: boat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
          cache: true
      - name: Test persistent-review source helper
        run: deno test --no-config --no-lock -A agent-skills/persistent-review/evidence.ts
      - name: Test persistent-review scheduler
        run: deno test --no-config --no-lock -A agent-skills/persistent-review/schedule.ts
      - name: Test interactive-artifact source helper
        run: deno test --no-config --no-lock -A agent-skills/interactive-artifact/interactive-artifact.ts
      - name: Test farhelm-plan-status collector
        run: deno test --no-config --no-lock -A agent-skills/farhelm-plan-status/scripts/collect
      - name: Test scode-build-goal watchdog
        run: deno test --no-config --no-lock -A agent-skills/scode-build-goal/scripts/watchdog
      # Exercise the real builder and compiled freshness checks on the existing Linux runner, for every helper.
      - name: Build and test compiled helpers
        run: cargo test --test helper_launcher -- --ignored
