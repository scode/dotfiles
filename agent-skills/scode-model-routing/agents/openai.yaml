# its read_skill tool refuses to load the skill for the model (verified on Muse Code 1.0.2), and
# this skill exists to be loaded by other skills.
interface:
  display_name: "Model routing"
  short_description: "Which model, effort, and launch mechanism a unit of delegated work should use"
